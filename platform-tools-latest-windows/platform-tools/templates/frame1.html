<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photobooth - UI Theme</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Font (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
    }

    /* Frosted glass effect */
    .glass-card {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
  </style>
</head>

<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

  <!-- Header -->
  <header class="relative w-full py-8 px-12">
    <h1 class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-5xl font-bold text-indigo-700">
      Photobooth
    </h1>
    <div class="absolute top-2 left-7 w-20 h-20 object-contain">
    <img src="static/images/logo2.png" alt="Logo" class="h-10 w-auto object-contain" />
    </div>

  <div class="absolute top-6 right-8">
    <img 
      src="static/images/logo3.png" 
      alt="Bottom Logo" 
      class="h-10 w-auto opacity-90 hover:opacity-100 transition-opacity duration-300"
    />
  </div>

  </header>

  <!-- Main Section -->
  <main class="flex-grow flex items-center justify-center">
    <div class="flex flex-row items-center justify-center gap-16">

      <!-- Left Card -->
      <div class="glass-card w-80 h-96 rounded-3xl shadow-2xl flex flex-col items-center justify-center gap-6 p-8">
        <img src="static/images/newcode.png" alt="QR Code Image" class="w-80 h-80 object-contain rounded-xl shadow-md" />
        <p class="text-indigo-600 font-medium text-lg">QR Code</p>
      </div>

      <!-- Divider -->
      <div class="h-80 border-l-2 border-dotted border-gray-300"></div>

      <!-- Right Column -->
      <div class="flex flex-col w-96">
        <p class="text-sm font-semibold text-indigo-500 tracking-wider uppercase">Get Started</p>
        <p class="mt-3 text-2xl font-medium text-gray-700">
          Scan the QR for experiencing photobooth
        </p>

        <ol class="list-none space-y-5 mt-8">
          <li class="flex items-center">
            <span class="flex items-center justify-center w-7 h-7 bg-indigo-500 text-white rounded-full font-bold text-base shadow-sm">1</span>
            <span class="ml-4 text-lg text-gray-600">Open your camera app.</span>
          </li>
          <li class="flex items-center">
            <span class="flex items-center justify-center w-7 h-7 bg-indigo-500 text-white rounded-full font-bold text-base shadow-sm">2</span>
            <span class="ml-4 text-lg text-gray-600">Point it at the QR code</span>
          </li>
          <li class="flex items-center">
            <span class="flex items-center justify-center w-7 h-7 bg-indigo-500 text-white rounded-full font-bold text-base shadow-sm">3</span>
            <span class="ml-4 text-lg text-gray-600">Start capturing memories!</span>
          </li>
        </ol>

        <div class="w-20 h-1.5 bg-indigo-500 rounded-full mt-8"></div>
      </div>
    </div>
  </main>


  <!-- SSE Script for WhatsApp Integration -->
  <script>
    console.log("🔌 Frame1: Connecting to event stream (Ngrok compatible)...");

    // Use relative URL - works with both localhost and ngrok
    const streamUrl = `${window.location.origin}/stream`;
    console.log("📡 Frame1: Connecting to:", streamUrl);

    const eventSource = new EventSource(streamUrl);

    // Connection opened successfully
    eventSource.onopen = function() {
        console.log("✅ Frame1: SSE connection established");
        console.log("🌐 Frame1: Connected via:", window.location.origin);
    };

    // Message received from server
    eventSource.onmessage = function(event) {
        console.log("📨 Frame1: Received data:", event.data);

        // Check if the server sent the "change" signal (triggered by WhatsApp "Hi" message)
        if (event.data === 'change') {
            console.log('🔄 Frame1: Received page change signal! Redirecting to /page2');
            
            // Close the connection before redirecting
            eventSource.close();
            
            // Redirect to frame2 (use relative URL for ngrok compatibility)
            window.location.href = `${window.location.origin}/page2`;
        } else {
            console.log('⚠️ Frame1: Unknown event received:', event.data);
        }
    };

    // Handle connection errors
    eventSource.onerror = function(err) {
        console.error('❌ Frame1: EventSource error occurred');
        console.log('🔄 Frame1: Connection ReadyState:', eventSource.readyState);
        console.log('🌐 Frame1: Current origin:', window.location.origin);
        
        // Log connection state
        if (eventSource.readyState === EventSource.CONNECTING) {
            console.log('🔄 Frame1: Reconnecting to SSE...');
        } else if (eventSource.readyState === EventSource.CLOSED) {
            console.log('❌ Frame1: SSE Connection closed permanently');
        }
    };

    // Cleanup when page is about to unload
    window.addEventListener('beforeunload', function() {
        console.log('👋 Frame1: Page unloading, closing SSE connection');
        eventSource.close();
    });

    // Additional debug info
    console.log('🖥️ Frame1: Current URL:', window.location.href);
    console.log('🔗 Frame1: Origin:', window.location.origin);
  </script>

</body>
</html>
